[project]
name = "husk-studio-sandbox"
version = "0.9.2"
description = "Husk HTTP cassettes — record/replay provider calls for model-free replay"
requires-python = ">=3.11"
license = { text = "BUSL-1.1" }
dependencies = [
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/husk_studio_sandbox"]
