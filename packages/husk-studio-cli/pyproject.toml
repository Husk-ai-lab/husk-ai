[project]
name = "husk-studio"
version = "0.9.2"
description = "Husk — the visual debugger for AI agents (CLI). Installs the `husk-studio` command. Local-first, source-available (BUSL 1.1)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BUSL-1.1" }
authors = [{ name = "Husk" }]
keywords = ["ai", "agents", "debugging", "opentelemetry", "langgraph", "cursor", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "click>=8.1",
    "rich>=13.9",
    "uvicorn[standard]>=0.32",
    "husk-studio-shared",
    "husk-studio-backend",
    # OTel SDK + OTLP/HTTP exporter so `husk-studio demo` can emit example traces
    # without a separate dev environment. The user gets a working demo with
    # just `pip install husk-studio`.
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    # MCP server (`husk-studio mcp`) — the official Model Context Protocol SDK
    # bundles FastMCP, which we use to expose Husk's runs/traces/replay to
    # Claude Code, Cursor, Claude Desktop, Windsurf, Lovable, etc. Lazy-imported
    # in the `mcp` command so other CLI commands stay fast.
    "mcp>=1.2",
]

[project.scripts]
husk-studio = "husk_studio.cli:main"
# Back-compat aliases: `husk-ai` was the command before the rename to Husk Studio and
# `husk` is the short form. Both keep working (MCP client configs and shell history
# written by older installs call them). End users installing from PyPI use `husk-studio`.
husk-ai = "husk_studio.cli:main"
husk = "husk_studio.cli:main"

[project.urls]
Homepage = "https://github.com/husk-ai-lab/husk-ai"
Documentation = "https://github.com/husk-ai-lab/husk-ai#readme"
Repository = "https://github.com/husk-ai-lab/husk-ai"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/husk_studio"]
