[project]
name = "husk-studio-shared"
version = "0.9.2"
description = "Husk shared Pydantic schemas and enums (used by CLI, sandbox, backend)"
requires-python = ">=3.11"
license = { text = "BUSL-1.1" }
dependencies = [
    "pydantic>=2.9",
    "python-ulid>=3.0",
]

# Optional extras: the framework adapters in husk_studio_shared.adapters. Core stays
# pydantic + ulid only — a user who never wires an SDK installs none of these.
# `otel` is the shared base (TracerProvider + OTLP/HTTP exporter); each framework
# extra pulls in its OpenInference instrumentor.
[project.optional-dependencies]
otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]
openai = [
    "husk-studio-shared[otel]",
    "openinference-instrumentation-openai>=0.1",
]
anthropic = [
    "husk-studio-shared[otel]",
    "openinference-instrumentation-anthropic>=0.1",
]
langgraph = [
    "husk-studio-shared[otel]",
    "openinference-instrumentation-langchain>=0.1",
]
llamaindex = [
    "husk-studio-shared[otel]",
    "openinference-instrumentation-llama-index>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/husk_studio_shared"]
